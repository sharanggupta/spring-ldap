name: Release Announcements - Stage

on:
  push:
    tags: '**'
  workflow_dispatch:
    inputs:
      version:
        description: The version to stage
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: read

jobs:
  stage-release-announcements:
    name: Stage Release Announcements
    uses: spring-io/spring-security-release-tools/.github/workflows/release-announcements-stage.yml@49dfd351a12637372333104b9f9a7b197b104e73 # v1.1.0-SNAPSHOT
    with:
      version: ${{ inputs.version || github.ref_name }}
    secrets: inherit
